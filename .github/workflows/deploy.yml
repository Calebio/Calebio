name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs so a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Publish only the site itself, never repo files like .github or README.
      - name: Collect site files
        run: |
          mkdir dist
          cp index.html _headers dist/
          cp -R images dist/images

      # Fails with a specific message if a secret is wrong, without printing either secret.
      - name: Check Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CF_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN is missing or empty"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing or empty"; exit 1; }
          [[ "$CF_ACCOUNT" =~ ^[0-9a-f]{32}$ ]] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not a 32-character ID (${#CF_ACCOUNT} characters; check for spaces or a wrong value)"; exit 1; }
          [[ "$CF_TOKEN" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::CLOUDFLARE_API_TOKEN contains spaces, a line break or other unexpected characters (${#CF_TOKEN} characters)"; exit 1; }
          verify="$(curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          echo "$verify" | grep -q '"status":"active"' || { echo "::error::Cloudflare does not recognise CLOUDFLARE_API_TOKEN as an active API token (wrong value, deleted, expired, or a Global API Key)"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/calebkalu")"
          [ "$code" = 200 ] || { echo "::error::The token is valid but can't access Pages project calebkalu in this account (HTTP $code). It needs Account > Cloudflare Pages > Edit, with this account included."; exit 1; }
          echo "Cloudflare credentials OK"

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.156.0"
          command: pages deploy dist --project-name=calebkalu --branch=main --commit-dirty=true

      - name: Check security headers are served
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          sleep 10
          headers="$(curl -sSI "$DEPLOY_URL")"
          echo "$headers"
          for h in content-security-policy strict-transport-security x-content-type-options referrer-policy permissions-policy; do
            echo "$headers" | grep -qi "^$h:" || { echo "::error::Missing header: $h"; exit 1; }
          done
